version: '3.8'

services:
  # Nginx - HTTPS/SSL termination and reverse proxy
  doh-nginx:
    image: nginx:alpine
    container_name: doh-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "8443:443"  # Internal port 8443, HAProxy will use 443
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./letsencrypt:/etc/letsencrypt:ro
    networks:
      - doh-network
    depends_on:
      - doh-backend

  # DoH Backend Server
  doh-backend:
    image: satishweb/doh-server:latest
    container_name: doh-backend
    restart: unless-stopped
    environment:
      - UPSTREAM_DNS_SERVER=doh-upstream:5053
      - DOH_HTTP_PREFIX=/dns-query
      - DOH_SERVER_LISTEN=:8053
      - DOH_SERVER_TIMEOUT=10
      - DOH_SERVER_TRIES=3
      - DOH_SERVER_VERBOSE=false
    expose:
      - "8053"
    networks:
      - doh-network
    depends_on:
      - doh-upstream
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8053/dns-query?name=google.com&type=A"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Cloudflared - Upstream DoH to Cloudflare
  doh-upstream:
    image: cloudflare/cloudflared:latest
    container_name: doh-upstream
    restart: unless-stopped
    command: proxy-dns
    environment:
      - TUNNEL_DNS_UPSTREAM=https://1.1.1.1/dns-query,https://1.0.0.1/dns-query
      - TUNNEL_DNS_ADDRESS=0.0.0.0
      - TUNNEL_DNS_PORT=5053
    expose:
      - "5053"
    networks:
      - doh-network

networks:
  doh-network:
    driver: bridge

